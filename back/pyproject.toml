[project]
name = "back"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zouazrou", email = "183734171+zouazrou@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.142.2",
    "pydantic[email]>=2.6.0",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
    "python-json-logger>=2.0.7",
]

[project.scripts]
back = "back:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpie>=3.2.4",
    "pytest==9.1.1",
]
