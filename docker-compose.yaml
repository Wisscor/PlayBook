services:
  postgres:
    build:
      context: ./back
      dockerfile: Dockerfile.db
    container_name: postgres
    # restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziko -d my-postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./back
      dockerfile: Dockerfile.api
    container_name: playbook-api
    labels:
      co.elastic.logs/enabled: "true"
      co.elastic.logs/json.keys_under_root: "true"
    # restart: always
    ports:
      - "127.0.0.1:8000:8000"
      # 'environment' attr has a higher priority than 'env_file' attr
    environment:
      DATABASE_URL: postgresql+asyncpg://ziko:1234pass@postgres:5432/my-postgres
    env_file:
      - ./back/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    
  front:
    build:
      context: ./front/playbook-web
      dockerfile: Dockerfile
    container_name: playbook-front
    # restart: always
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
